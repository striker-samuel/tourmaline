# GPU-free regression checks for accidental text encoding corruption.
# The unittest suite IS the enforcement: fixtures + a full tracked-tree
# scan (see tests/test_text_integrity.py).
name: Text integrity

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Text integrity fixtures + tracked-tree scan
        run: python -m unittest discover -s tests -p 'test_text_integrity.py' -v
