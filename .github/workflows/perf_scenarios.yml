name: Perf scenario catalog
on:
  push:
    paths:
      - 'tools/perf_harness.py'
      - 'tools/tests/**'
      - 'benchmarks/**'
      - '.github/workflows/perf_scenarios.yml'
  pull_request:
    paths:
      - 'tools/perf_harness.py'
      - 'tools/tests/**'
      - 'benchmarks/**'
      - '.github/workflows/perf_scenarios.yml'

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate the agent CLI and scenario catalog without a GPU
        run: |
          python -m compileall -q tools/perf_harness.py tools/tests
          python -m unittest discover -s tools/tests -v
          python tools/perf_harness.py list
