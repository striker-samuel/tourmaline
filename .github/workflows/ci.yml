# CI: build the full tree + run the test suite on both supported platforms.
#
#   Linux   - Ubuntu 24.04 + GCC 14 (the verified configuration)
#   Windows - MSVC x64 + the Vulkan SDK (dxc.exe compiles the shaders)
#
# retirement_fuzz_tests is EXCLUDED on both: it creates a real SDL window +
# offscreen Vulkan device, and hosted runners have neither a display nor a
# Vulkan ICD. It runs in dev environments (real GPU / WSLg).
#
# Caches:
#   - sccache compiler output on LINUX (the big one: Embree's AVX-512 TUs;
#     first run populates, subsequent runs hit - see the "Compiler cache
#     stats" step. Windows deliberately runs without it: measured 2.5+h vs
#     ~25 min cold - see the note on the windows job)
#   - KTX-Software 4.4.2 install (built from source on first miss)
#   - the Vulkan SDK install (Windows; installed on first miss)
#   - external/.downloads (the installer scripts' pinned archives) keyed on
#     the installer scripts' hash
#
# Not covered: the runtime render loop (needs a real GPU - see the README
# platform notes).

name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (Ubuntu 24.04, GCC 14)
    runs-on: ubuntu-24.04
    env:
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - name: Checkout (submodules recursive)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup compiler cache (sccache)
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-14 g++-14 \
            build-essential cmake ninja-build git curl unzip pkg-config \
            glslang-tools libvulkan-dev zlib1g-dev mesa-vulkan-drivers \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxinerama-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libegl1-mesa-dev libgl1-mesa-dev libasound2-dev libpulse-dev \
            libdbus-1-dev libudev-dev libunwind-dev libpipewire-0.3-dev \
            libdecor-0-dev libgbm-dev libdrm-dev libv4l-dev libinput-dev

      - name: Cache KTX-Software install
        id: ktx-cache
        uses: actions/cache@v4
        with:
          path: ~/ktx
          key: ktx-4.4.2-${{ runner.os }}

      - name: Build and install KTX-Software 4.4.2 (cache miss)
        if: steps.ktx-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch v4.4.2 \
            https://github.com/KhronosGroup/KTX-Software /tmp/ktx-src
          cmake -S /tmp/ktx-src -B /tmp/ktx-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DKTX_FEATURE_TOOLS=OFF -DKTX_FEATURE_TESTS=OFF -DKTX_FEATURE_DOC=OFF \
            -DCMAKE_INSTALL_PREFIX=$HOME/ktx
          cmake --build /tmp/ktx-build
          cmake --install /tmp/ktx-build

      - name: Cache third-party downloads
        uses: actions/cache@v4
        with:
          path: external/.downloads
          key: deps-downloads-${{ runner.os }}-${{ hashFiles('install_dependencies.sh', 'install_dependencies.ps1') }}

      - name: Fetch third-party deps (install_dependencies.sh)
        run: ./install_dependencies.sh

      - name: Configure
        run: >
          cmake -B out/build/ci -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14
          -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          -DKTX_ROOT=$HOME/ktx .

      - name: Build (all targets)
        run: cmake --build out/build/ci

      - name: Compiler cache stats
        run: sccache --show-stats

      - name: Test
        run: |
          mkdir -p .ci-content
          # retirement_fuzz excluded: real SDL window + offscreen Vulkan
          # device - hosted runners have no display / ICD (see the header).
          ctest --test-dir out/build/ci --output-on-failure \
            -E "^retirement_fuzz_tests$"
        env:
          TOURMALINE_CONTENT_DIR: ${{ github.workspace }}/.ci-content

  windows:
    name: Windows (MSVC x64)
    runs-on: windows-latest
    # NOTE: no sccache here, deliberately. Measured on the runners: with
    # the compiler cache riding the build (cold), the MSVC + engine-PCH +
    # Embree AVX-512 build ran 2.5+ HOURS vs ~25 minutes without it (the
    # Linux job completed in normal time and keeps its sccache). If Windows
    # compile caching is wanted, diagnose the slowdown first (PCH/obj size
    # on the 2-core runners is the prime suspect).
    steps:
      - name: Checkout (submodules recursive)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache Vulkan SDK install
        id: vulkan-cache
        uses: actions/cache@v4
        with:
          path: C:\VulkanSDK\1.4.357.0
          key: vulkan-sdk-1.4.357.0-windows

      - name: Install Vulkan SDK (cache miss)
        if: steps.vulkan-cache.outputs.cache-hit != 'true'
        run: |
          curl.exe -L -o $env:RUNNER_TEMP\vulkan-sdk.exe `
            https://sdk.lunarg.com/sdk/download/1.4.357.0/windows/vulkan-sdk.exe
          Start-Process -Wait -FilePath $env:RUNNER_TEMP\vulkan-sdk.exe `
            -ArgumentList '--accept-licenses','--default-answer','--confirm-command','install'

      - name: Expose the Vulkan SDK (VULKAN_SDK + PATH)
        run: |
          Add-Content $env:GITHUB_ENV 'VULKAN_SDK=C:\VulkanSDK\1.4.357.0'
          Add-Content $env:GITHUB_PATH 'C:\VulkanSDK\1.4.357.0\Bin'

      - name: Cache prebuilt Embree 4.4.1 (x64 windows)
        id: embree-cache
        uses: actions/cache@v4
        with:
          path: C:\embree
          key: embree-4.4.1-x64-windows

      - name: Download prebuilt Embree (cache miss)
        if: steps.embree-cache.outputs.cache-hit != 'true'
        run: |
          curl.exe -L -o $env:TEMP\embree.zip `
            https://github.com/embree/embree/releases/download/v4.4.1/embree-4.4.1.x64.windows.zip
          $hash = (Get-FileHash $env:TEMP\embree.zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne '5aa1fa3161a720f9c610b06c652b80f421cb2b1fe8221fdf92b74157336fdf8f') {
            throw "embree zip sha mismatch: $hash"
          }
          Expand-Archive $env:TEMP\embree.zip -DestinationPath $env:TEMP\embree-x
          Move-Item "$env:TEMP\embree-x\embree-4.4.1.x64.windows" C:\embree

      - name: Cache KTX-Software install
        id: ktx-cache
        uses: actions/cache@v4
        with:
          path: C:\ktx
          key: ktx-4.4.2-${{ runner.os }}

      - name: Build and install KTX-Software 4.4.2 (cache miss)
        if: steps.ktx-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch v4.4.2 `
            https://github.com/KhronosGroup/KTX-Software $env:TEMP\ktx-src
          cmake -S $env:TEMP\ktx-src -B $env:TEMP\ktx-build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DKTX_FEATURE_TOOLS=OFF -DKTX_FEATURE_TESTS=OFF -DKTX_FEATURE_DOC=OFF `
            -DCMAKE_INSTALL_PREFIX=C:/ktx
          cmake --build $env:TEMP\ktx-build
          cmake --install $env:TEMP\ktx-build

      - name: Cache third-party downloads
        uses: actions/cache@v4
        with:
          path: external\.downloads
          key: deps-downloads-${{ runner.os }}-${{ hashFiles('install_dependencies.sh', 'install_dependencies.ps1') }}

      - name: Fetch third-party deps (install_dependencies.ps1)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File install_dependencies.ps1

      - name: Configure
        run: >
          cmake -B out/build/ci -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DEMBREE_PREBUILT_DIR=C:/embree
          -DKTX_ROOT=C:/ktx .

      - name: Build (all targets)
        run: cmake --build out/build/ci

      - name: Test
        run: |
          New-Item -ItemType Directory -Force .ci-content | Out-Null
          ctest --test-dir out/build/ci --output-on-failure `
            -E "^retirement_fuzz_tests$"
        env:
          TOURMALINE_CONTENT_DIR: ${{ github.workspace }}\.ci-content
        # retirement_fuzz_tests is excluded: it creates a real offscreen
        # Vulkan device (deferred-retirement soak) and hosted Windows
        # runners expose no Vulkan ICD. The Linux job runs it on lavapipe.
