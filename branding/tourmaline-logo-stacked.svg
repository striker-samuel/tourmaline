<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="635" viewBox="0 0 760 635" role="img" aria-labelledby="title desc">
<title id="title">Tourmaline — stacked crystal logo</title>
<desc id="desc">Editable vector mark for Tourmaline, a Vulkan renderer. A teal frame meets an orange-to-magenta-to-violet faceted mineral.</desc>
<defs>
  <linearGradient id="teal" x1="142" y1="245" x2="370" y2="35" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#00A99B"/>
    <stop offset="0.55" stop-color="#00AC9F"/>
    <stop offset="1" stop-color="#00B8AD"/>
  </linearGradient>
  <linearGradient id="stone" x1="420" y1="61" x2="276" y2="285" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#FF940D"/>
    <stop offset="0.20" stop-color="#FF7515"/>
    <stop offset="0.46" stop-color="#EA306A"/>
    <stop offset="0.70" stop-color="#8C187E"/>
    <stop offset="1" stop-color="#360960"/>
  </linearGradient>
  <linearGradient id="crown" x1="329" y1="139" x2="404" y2="60" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#FF8B30"/>
    <stop offset="0.62" stop-color="#FFC05C"/>
    <stop offset="1" stop-color="#FFD777"/>
  </linearGradient>
  <linearGradient id="middle" x1="345" y1="122" x2="339" y2="222" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#FF7238"/>
    <stop offset="0.55" stop-color="#E73B70"/>
    <stop offset="1" stop-color="#B01B84"/>
  </linearGradient>
  <linearGradient id="leftFacet" x1="235" y1="168" x2="288" y2="252" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#A51C85"/>
    <stop offset="1" stop-color="#4C086F"/>
  </linearGradient>
  <linearGradient id="baseFacet" x1="295" y1="237" x2="295" y2="285" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#5D0A75"/>
    <stop offset="1" stop-color="#36085E"/>
  </linearGradient>
  <linearGradient id="sideFacet" x1="422" y1="110" x2="405" y2="260" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#E84822"/>
    <stop offset="0.48" stop-color="#B22960"/>
    <stop offset="1" stop-color="#6A0D74"/>
  </linearGradient>
  <clipPath id="stone-clip">
    <path d="M428 56 C374 75 294 122 245 164 C204 199 184 231 191 252 C200 275 259 282 312 279 C354 277 392 270 415 260 C436 231 449 185 449 147 C449 111 441 59 428 56 Z"/>
  </clipPath>
</defs>
<g transform="translate(-16 39) scale(1.40)"><g id="mark" aria-label="Tourmaline crystal mark">
  <!-- Rounded mineral frame: a single smooth, editable shape -->
  <path id="teal-frame" fill="url(#teal)" d="M385 60 C358 32 317 29 269 32 C226 33 178 44 158 59 C145 70 139 99 134 132 C127 175 132 222 143 241 C150 254 162 258 186 255 L188 229 C171 230 168 218 164 199 C159 169 162 122 174 91 C180 76 220 65 267 58 C312 51 346 58 363 78 Z"/>
  <!-- Smooth tourmaline silhouette; all additional facets remain inside this shape -->
  <path id="gemstone" fill="url(#stone)" d="M428 56 C374 75 294 122 245 164 C204 199 184 231 191 252 C200 275 259 282 312 279 C354 277 392 270 415 260 C436 231 449 185 449 147 C449 111 441 59 428 56 Z"/>
  <g id="crystal-facets" clip-path="url(#stone-clip)">
    <!-- Crown facets make the logo read as a polished cut mineral -->
    <path id="top-orange-rim" fill="#FF8420" d="M244 165 C288 124 377 72 428 56 L407 115 L261 163 Z"/>
    <path id="light-facet" fill="url(#crown)" d="M261 163 L428 56 L407 115 Z"/>
    <path id="center-facet" fill="url(#middle)" d="M261 163 L407 114 L380 230 Z"/>
    <path id="left-facet" fill="url(#leftFacet)" d="M261 162 L380 230 L190 253 Z"/>
    <path id="front-left-facet" fill="#791078" opacity=".66" d="M244 164 L261 163 L190 253 C190 233 210 198 244 164 Z"/>
    <path id="side-facet" fill="url(#sideFacet)" d="M428 56 L451 146 L415 261 L380 230 L407 114 Z"/>
    <path id="base-facet" fill="url(#baseFacet)" d="M190 253 L380 230 L415 260 C379 279 262 296 190 253 Z"/>
    <!-- Tiny upper right plane to brighten the mineral's sharp corner -->
    <path id="tip-highlight" fill="#FFA126" opacity=".70" d="M428 56 L407 115 L450 145 C449 107 442 66 428 56 Z"/>
  </g>
</g></g>
